name: VFX data and search checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Verify upstream data and all JSON schemas
        run: python scripts/validate_data.py
      - name: Verify upstream search adapter
        run: python -m unittest discover -s tests -v
      - name: Smoke test bilingual search
        run: |
          python scripts/search_atoms.py "剑气" --family weapon --limit 5
          python scripts/search_atoms.py "雨滴" --family environment-weather --json
          python scripts/search_atoms.py "雨滴" --tag rain --tag weather --json
          python scripts/search_atoms.py "辉光" --medium semi-realistic-japanese-cg --style mj-dreamlike --json
      - name: Smoke test P3 approved-card prompt compilation
        run: |
          python scripts/compile_prompt.py --card sample.sword-activation
          python scripts/compile_prompt.py --card sample.rainy-street --json
          python scripts/compile_prompt.py --cards examples/p3-ten-cards.json --card p3.power-aura
      - name: Smoke test P4 sourced visual case index and profile routing
        run: |
          python adapters/sakuga_catalog.py --check
          python scripts/search_cases.py --element water --form impact --limit 5
          python scripts/search_cases.py --paired-with water_charge_01 --json
          python scripts/lookup_profile.py --axis family --id spatial
          python scripts/lookup_profile.py --axis style --id mj-dreamlike --json
      - name: Smoke test P5 novice option-first gate and two model adapters
        run: |
          python scripts/recommend_options.py --package examples/recommendations/sword-image.json
          python scripts/recommend_options.py --package examples/recommendations/rainy-street.json --select A1 --user-confirmed --json
          python scripts/adapt_prompt.py --card sample.sword-activation --json
          python scripts/adapt_prompt.py --card sample.rainy-street --model seedance --json
      - name: Smoke test P5 continuous shots versus independent montage
        run: |
          python scripts/check_shot_states.py --file examples/sequences/continuous-sword.json
          python scripts/check_shot_states.py --file examples/sequences/continuous-mecha.json --json
          python scripts/check_shot_states.py --file examples/sequences/montage-weather.json
          python scripts/check_shot_states.py --file examples/sequences/mixed-explicit-reset.json
      - name: Smoke test P6 evidence-aware QC and targeted single-issue repair
        run: |
          python scripts/review_vfx.py --review tests/fixtures/qc/design-good-sword.json --json
          python scripts/review_vfx.py --review tests/fixtures/qc/design-good-snow.json --fail-on-blocked
          python scripts/review_vfx.py --review tests/fixtures/qc/design-bad-early-contact.json --json
          if python scripts/review_vfx.py --review tests/fixtures/qc/design-bad-no-choice.json --fail-on-blocked; then
            echo "ERROR: a hard-failed QC report was incorrectly accepted"
            exit 1
          fi
