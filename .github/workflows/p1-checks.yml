name: P1 VFX data checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify upstream data and case schemas
        run: python scripts/validate_data.py
      - name: Verify upstream search adapter
        run: python -m unittest discover -s tests -v
      - name: Smoke test bilingual search
        run: |
          python scripts/search_atoms.py "剑气" --family weapon --limit 5
          python scripts/search_atoms.py "雨滴" --family environment-weather --json
